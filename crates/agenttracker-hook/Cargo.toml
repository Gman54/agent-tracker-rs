[package]
name = "agenttracker-hook"
description = "Tiny hook program invoked by AI agents; forwards events to the local AgentTracker collector"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "agenttracker-hook"
path = "src/main.rs"

[dependencies]
# Only lightweight pieces are used at runtime (HMAC signing; redaction only on the offline path).
tracker-common = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[build-dependencies]
embed-resource = "3"
