[package]
name = "agenttracker-runtime"
description = "Houndbit instrumented decision runtime: structured decision proposals, provenance, controlled tools"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
agenttracker-core = { workspace = true }
tracker-common = { workspace = true }
protect-engine = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rusqlite = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
ureq = { version = "2", features = ["json"] }
chacha20poly1305 = "0.10"
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "time"] }
futures-util = { version = "0.3", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_System_Memory"] }

[dev-dependencies]
tempfile = { workspace = true }
