[package]
name = "agenttracker-acceptance"
description = "Acceptance tests for Houndbit (fake-agent contract tests; no live connectors)"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
agenttracker-core = { workspace = true }
tracker-common = { workspace = true }
serde_json = { workspace = true }
rusqlite = { workspace = true }
tempfile = { workspace = true }
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tower = { version = "0.4", features = ["util"] }

[dev-dependencies]
# Only used by tests/protect_plugin.rs, which checks Houndbit and Protect side by side.
protect-engine = { path = "../crates/protect-engine" }
uuid = { workspace = true }
